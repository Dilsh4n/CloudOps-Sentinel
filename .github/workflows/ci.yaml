
name: CloudOps Sentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'

jobs:

  quality:
    name: Python and Bash validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements-pinned.txt

      - name: Install dependencies
        run: |
          python --version
          python -m pip install -r requirements-pinned.txt

      - name: Run existing CI checks
        run: bash scripts/check_ci.sh


# job2: Compatibility
  Compatibility:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: setup python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-pinned.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-pinned.txt

      - name: Run tests and generate report
        run: |
          mkdir -p reports
          python -m pytest -q --junitxml=reports/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          path: reports/pytest.xml
          name: pytest-${{ matrix.os }}
          retention-days: 7

  # Job 3: image build and push to GHCR
  container:
    name: Docker image validation
    needs: [quality, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: cloudops-sentinel:ci
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      - name: Start application container
        run: |
          docker run -d \
            --name cloudops-sentinel-ci \
            -p 127.0.0.1:8000:8000 \
            cloudops-sentinel:ci

      - name: Smoke test application
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              echo "Container smoke test passed"
              exit 0
            fi

            echo "Application not ready yet..."
            sleep 2
          done

          echo "Container smoke test failed"
          exit 1

      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker logs cloudops-sentinel-ci || true

      - name: Remove temporary container
        if: ${{ always() }}
        run: docker rm -f cloudops-sentinel-ci || true


  # Job 4: Final quality gate
  gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quality, compatibility, container]
    if: ${{ always() }}

    steps:
      - name: Verify all CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          ASSOCIATED_ACCOUNT: ${{ github.actor }}
          ASSOCIATED_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          echo "Quality result: $QUALITY_RESULT"
          echo "Compatibility result: $COMPATIBILITY_RESULT"
          echo "Container result: $CONTAINER_RESULT"
          echo "Associated GH account: ${{ github.actor }}"
          echo "Associated GH Token: ${{ secrets.GITHUB_TOKEN }}"
          echo "Github repository : ${{ github.repository }}"

          if [[ "$QUALITY_RESULT" != "success" ||
                "$COMPATIBILITY_RESULT" != "success" || 
                "$CONTAINER_RESULT" != "success" ]]; then
            echo "CI pipeline failed"
            exit 1
          fi

          echo "All CI checks passed"

  
  # Job 5: Publish validated application to GHCR
  publish:
    name: Publish Docker image to GHCR
    needs: gate

    # Publish only on pushes to main
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Download the source code
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Step 2: Prepare Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Step 3: Authenticate to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Generate image tags and labels
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=CloudOps Sentinel monitoring API

      # Step 5: Build and publish the image
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6: Display published image information
      - name: Show published image details
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Published image tags:"
          printf '%s\n' "$IMAGE_TAGS"

          echo "Image digest: $IMAGE_DIGEST"

          {
            echo "### Published Docker image"
            printf '%s\n' "$IMAGE_TAGS"
            echo "Digest: $IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

